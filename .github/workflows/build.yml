name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Actions are pinned by commit SHA (version in the comment): a moved tag cannot change what
# runs next to the signing secrets. Update by looking up the new tag's commit.
permissions:
  contents: write

jobs:
  build:
    # A fixed image, so a new "latest" cannot change the build unannounced.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: '8.13'

      - name: Unit tests
        run: |
          set -o pipefail
          gradle --no-daemon testDebugUnitTest 2>&1 | tee test.log

      - name: Prepare signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No signing key in secrets. Building a debug APK; each build will need an uninstall before installing."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -o pipefail
          if [ "$SIGNED" = "true" ]; then
            gradle --no-daemon assembleRelease 2>&1 | tee build.log
            cp app/build/outputs/apk/release/app-release.apk HelatPlayer.apk
          else
            gradle --no-daemon assembleDebug 2>&1 | tee build.log
            cp app/build/outputs/apk/debug/app-debug.apk HelatPlayer.apk
          fi

      - name: Summarize build errors
        if: failure()
        run: |
          # Put compiler errors and failed tests in one annotation so they show on the run summary page.
          summary=$(cat test.log build.log 2>/dev/null \
            | grep -E "^e: | FAILED$|What went wrong|error:" -A12 | grep -v "^--$" | head -80 \
            | sed -e 's/%/%25/g' -e 's/\r//g' | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=Build errors::${summary:-No error lines found in the logs}"

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: HelatPlayer
          path: HelatPlayer.apk

      - name: Publish release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: HelatPlayer.apk
          prerelease: ${{ steps.signing.outputs.signed != 'true' }}
